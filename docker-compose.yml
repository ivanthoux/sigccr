# SIG-CCR - Arquitectura ejecutable (RNF-04, sección 4.4.5)
# Mismas imágenes en desarrollo (Windows + WSL 2) y producción (Linux + Docker Engine);
# las diferencias se limitan al archivo .env de CodeIgniter y a las variables de este compose.
name: sigccr

services:
  web:
    image: nginx:1.27-alpine
    depends_on: [app]
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./public:/var/www/html/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/certs:/etc/nginx/certs:ro
    networks: [sigccr_net]
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    image: sigccr/php:8.3
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["bash", "/var/www/html/docker/php/entrypoint.sh"]   # prepara writable/ en cada arranque
    command: ["php-fpm"]
    volumes:
      - ./:/var/www/html
      - storage:/var/www/html/writable
      - backups:/var/opt/sigccr/backups:ro   # descarga de copias (CU-62); las genera y restaura el scheduler (D-45)
    env_file: .env.docker               # MSSQL_SA_PASSWORD, solo para crear la base con sqlcmd
    environment:
      TZ: UTC                           # instantes en UTC; la zona de negocio la aplica la aplicación (3.5.1)
    networks: [sigccr_net]
    restart: unless-stopped

  scheduler:
    image: sigccr/php:8.3
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["bash", "/var/www/html/docker/php/entrypoint.sh"]
    command: ["cron", "-f"]
    volumes:
      - ./:/var/www/html
      - storage:/var/www/html/writable
      - backups:/var/opt/sigccr/backups     # copias de seguridad: copias:generar y copias:procesar (D-45)
    environment:
      TZ: America/Argentina/Buenos_Aires   # cron dispara en hora local de negocio (RNF-10 f)
    networks: [sigccr_net]
    restart: unless-stopped

  # Correo de desarrollo (D-49): recibe los correos del SIG-CCR sin entregarlos a nadie y los muestra en
  # http://localhost:8025. Se levanta una vez con «docker compose --profile correo up -d» y el .env apunta el SMTP a
  # mailpit:1025 (env.sigccr.example). No se usa en producción, donde el SMTP es el del proveedor.
  mailpit:
    image: axllent/mailpit:v1.27.10
    profiles: [correo]
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-8025}:8025"   # solo desde el propio equipo; el SMTP (1025) queda en la red interna
    environment:
      MP_DATABASE: /data/mailpit.db              # los correos se conservan al reiniciar el contenedor
      MP_MAX_MESSAGES: "1000"
      MP_SMTP_AUTH_ACCEPT_ANY: "true"            # acepta el envío con o sin usuario, como un proveedor de pruebas
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
      TZ: America/Argentina/Buenos_Aires
    volumes:
      - correos:/data
    networks: [sigccr_net]
    restart: unless-stopped

  db:
    # Versión acumulativa fija (D-62): el entorno no cambia solo cuando Microsoft publica una actualización.
    # Para actualizarla, ver «Actualizar la versión de SQL Server» en el README (el mismo valor va en ci.yml).
    image: mcr.microsoft.com/mssql/server:2022-CU28-ubuntu-22.04
    # .env.docker (fuera del repositorio) define MSSQL_SA_PASSWORD y MSSQL_PID:
    # Developer en desarrollo, Express en producción (RNF-06).
    env_file: .env.docker
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_COLLATION: Modern_Spanish_CI_AI
    volumes:
      - sqldata:/var/opt/mssql
      - backups:/var/opt/sigccr/backups
    # Grupo www-data (gid 33 de la imagen de PHP): SQL Server lee las copias que deja PHP sin dar permisos a otros
    # usuarios (archivos 0640, carpeta 2770; D-45)
    group_add: ["33"]
    # El puerto 1433 no se publica en producción. Para usar SSMS o Azure Data Studio en desarrollo,
    # agregar en un docker-compose.override.yml:  ports: ["1433:1433"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks: [sigccr_net]
    restart: unless-stopped

volumes:
  sqldata:      # datos de SQL Server, independientes del contenedor (plan correctivo de R4)
  storage:      # writable/: adjuntos, sesiones, caché y registros técnicos
  backups:      # copias de seguridad cifradas (RNF-13)
  correos:      # buzón de Mailpit, solo en desarrollo (D-49)

networks:
  sigccr_net:
