name: E2E

# La batería tarda unos 15 minutos: se ejecuta al cierre de cada iteración, en el pull request de develop a main
# que publica la versión, o a pedido desde Actions → E2E → Run workflow (D-41). Los cambios intermedios se
# controlan con el flujo CI (pruebas unitarias, rutas por rol y análisis estático).
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      capturas:
        description: "Generar las capturas del manual de usuario (rama capturas-manual)"
        type: boolean
        default: false

jobs:
  e2e:
    name: Pruebas de punta a punta (Playwright y SQL Server)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CI: "1"
      E2E_CONSERVAR: "1"   # la pila queda levantada para mostrar sus registros si algo falla
      E2E_CAPTURAS: ${{ inputs.capturas && '1' || '' }}
    permissions:
      contents: write   # solo para publicar las capturas del manual en su rama
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Pila desde cero, migraciones, semillas y Playwright
        run: bash tests/e2e/ejecutar.sh

      - name: Capturas del manual de usuario (rama capturas-manual)
        if: always() && inputs.capturas
        run: |
          cd tests/e2e/capturas
          git init -q -b capturas-manual
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" add .
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" commit -q -m "Capturas del manual de usuario (${GITHUB_SHA::7})"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" capturas-manual

      - name: Informe con capturas
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: informe-e2e
          path: |
            tests/e2e/informe/
            tests/e2e/resultados/
          retention-days: 14

      - name: Registros de la aplicación ante una falla
        if: failure()
        run: |
          docker compose -p sigccr_e2e logs --tail 200 app web db || true
          docker compose -p sigccr_e2e exec -T app sh -c 'tail -n 200 writable/logs/*.log' || true
