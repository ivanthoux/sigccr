# Actualización de dependencias (OWASP ASVS 5.0 V15.1.1 y V15.2.1; docs/seguridad/politica_dependencias.md).
# Dependabot abre un pull request por semana con las actualizaciones y otro, de inmediato, por cada aviso de seguridad.
version: 2
updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      php-menores:
        update-types: [minor, patch]
    labels: [dependencias]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: [dependencias]

  - package-ecosystem: docker
    directory: /docker/php
    schedule:
      interval: weekly
      day: monday
    labels: [dependencias]

  - package-ecosystem: npm
    directory: /tests/e2e
    schedule:
      interval: weekly
      day: monday
    groups:
      e2e:
        update-types: [minor, patch]
    labels: [dependencias]
