; Configuración de PHP del SIG-CCR
date.timezone = UTC
expose_php = Off
memory_limit = 256M
max_execution_time = 60

; Adjuntos de hasta 5 MB cada uno (RNF-12): un archivo mayor llega con UPLOAD_ERR_INI_SIZE y la aplicación lo informa
; junto a su campo. El total admite varios adjuntos en un mismo formulario (alta de cliente), igual que Nginx.
upload_max_filesize = 6M
post_max_size = 64M
max_file_uploads = 30

; Sesiones (RNF-11): la expiración por inactividad la controla la aplicación
session.cookie_httponly = 1
session.cookie_secure = 1
session.cookie_samesite = Lax
session.use_strict_mode = 1

; En producción los errores no se muestran (RNF-12); CodeIgniter los registra en writable/logs
display_errors = Off
log_errors = On

opcache.enable = 1
opcache.validate_timestamps = 1

; Cobertura: pcov se activa solo al medirla (composer cobertura)
pcov.enabled = 0
pcov.directory = /var/www/html/app
