# Análisis automático de SonarQube Cloud.
# Los scripts de app/Database/Sql son T-SQL de SQL Server, que el análisis automático interpreta con las reglas de
# PL/SQL de Oracle (por ejemplo, «Use VARCHAR2 instead of CHAR»). Se excluyen del análisis; su estructura la verifica
# docs/modelo-datos/verificar.py contra el modelo de datos.
#
# También se excluyen los archivos que trae CodeIgniter sin cambios (punto de entrada, precarga, tipos MIME, páginas de error de
# depuración y los index.html que impiden listar carpetas) y el ejecutor de pruebas sin Composer de tests/_local,
# documentado en el README: no son código del sistema. La página de error que ve el usuario
# (app/Views/errors/html/production.php) sí se analiza.
sonar.exclusions=app/Database/Sql/**,public/index.php,preload.php,app/index.html,tests/index.html,app/Views/errors/cli/**,app/Views/errors/html/error_exception.php,tests/_local/**,app/Config/Mimes.php
# Los archivos de configuración de app/Config son listas declarativas (menú, permisos, rutas) con filas de la misma
# forma: el detector de duplicados las cuenta como código repetido. Se excluyen solo de ese control.
sonar.cpd.exclusions=app/Config/**
